name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The suite runs against a real PostgreSQL with pgvector, not a stub: the
    # behaviour worth protecting (bi-temporal queries, ANN search, the
    # consistency of the `status` projection) only exists in SQL.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: mp
          POSTGRES_PASSWORD: mp
          POSTGRES_DB: memory_palace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mp -d memory_palace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # A disposable name: the test suite refuses to truncate anything else.
      DATABASE_URL: postgresql://mp:mp@127.0.0.1:5432/memory_palace_test
      # Mock providers: no API key, no network, no cost. The oracle/null
      # calibration assertions in evals/harness.test.ts run here.
      MP_LLM_PROVIDER: mock
      MP_EMBEDDING_PROVIDER: mock
      MP_LOG_LEVEL: error

    steps:
      # Full history, not the default shallow clone. `pnpm prior-art check` accepts
      # a commit sha as evidence that an idea was adopted, and a checkout with
      # fetch-depth 1 cannot verify one: the citation resolved locally and came
      # back "no commit b82f4bd in this checkout" here. The check was right — CI
      # simply had nothing to check against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Version comes from the `packageManager` field, so CI cannot drift from
      # what developers run locally.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # The README is published in English and Chinese. Keeping them in step is
      # otherwise a promise nobody can check, and a translation that quietly
      # misses a section reads as complete. This compares what is language
      # independent — heading levels, code blocks, tables, links, inline code —
      # and needs no database, so it runs first and fails fast.
      - run: pnpm docs:check

      # The prior-art list claims that this repository embodies certain ideas, and
      # names the file, dataset case or commit that proves it. Renaming a file
      # should therefore fail the build rather than leave a stale claim on a page.
      # No database needed — it resolves against the checkout.
      - run: pnpm prior-art check

      # Build BEFORE migrating. Two reasons, and the first one broke this
      # workflow on its first substantive step:
      #
      #  1. Until recently the tsx-based CLIs resolved workspace packages through
      #     their `exports` field, i.e. to `dist/`, so `pnpm migrate` died with
      #     ERR_MODULE_NOT_FOUND before a build had ever run. That is now fixed
      #     at the source (tsconfig.tools.json maps the packages to `src`), and
      #     this ordering is the second line of defence.
      #  2. The runtime asserts its configured embedding width against the
      #     schema, so the schema has to exist before anything runs.
      - run: pnpm build

      # Typecheck the entry points that live outside the package graph: the CLIs
      # and the eval harness. `pnpm test` transpiles them without typechecking,
      # so this is the only thing that would catch a broken `pnpm demo`.
      - run: pnpm typecheck:tools

      - run: pnpm migrate

      - run: pnpm test

      # The walkthrough verifies its own claims, and the SECOND run is the one
      # that matters: it re-ingests text the first run already stored, which is
      # the only place the dedup-and-repeat path is exercised end to end. A
      # foreign key violation lived exactly there, reachable only by running the
      # demo twice, and nothing in the suite could see it.
      - run: pnpm demo --reset
      - run: pnpm demo

      # A fresh clone has no dist/. This asserts the documented entry path works
      # from that state, which is the failure CI itself hit and the README
      # previously sent new users straight into.
      - name: documented entry path works without a build
        run: |
          # Remove every build artifact, so the next commands run against the
          # same state a fresh clone is in. Before tsconfig.tools.json mapped the
          # workspace packages to src, `pnpm migrate` failed here — and this
          # workflow aborted before reaching pnpm test at all.
          rm -rf packages/*/dist apps/*/dist
          pnpm migrate
          pnpm demo --reset
